  /api/v1/voice/calls/{call_id}/play:
    post:
      tags:
      - Voice / Call Controls
      summary: Play an audio file into the call
      description: Play an audio file into the call. The response includes a `playback_id` you can use to correlate playback lifecycle webhooks.
      operationId: play_audio
      parameters:
      - name: call_id
        in: path
        required: true
        schema:
          type: string
          title: Call Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
