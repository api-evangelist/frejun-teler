notes: |
  The provider also publishes softphone client SDKs (react-native-softphone-sdk,
  android-softphone-sdk, frejun-softphone-wrapper) and many reference
  integration bridges (teler-openai-bridge, teler-gemini-bridge,
  teler-deepgram-bridge, teler-elevenlabs-bridge, teler-vapi-bridge, etc.) in
