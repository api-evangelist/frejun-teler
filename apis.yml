apis:
- name: Teler Voice API
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  description: Programmable voice/telephony API. Places and controls live voice calls (initiate, play
    audio, DTMF, transfer, hangup), streams bidirectional call audio to AI agents over a WebSocket media
    channel, and provisions programmable SIP trunking (trunks, IP ACLs, virtual numbers). REST resources
    for calls, voice apps, virtual numbers, SIP trunks/calls, webhook events, recordings and secrets use
    cursor pagination. Served from https://api.frejun.ai and authenticated with an x-api-key header.
    Backed by official Python (teler) and Node (@frejun/teler) SDKs.
  humanURL: https://frejun.com/docs/teler/
  baseURL: https://api.frejun.ai
