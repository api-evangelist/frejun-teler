aid: frejun-teler
name: FreJun Teler
description: FreJun Teler is a developer-first programmable voice/telephony API (CPaaS) that handles carriers,
  phone numbers, and real-time audio streaming so developers can connect AI models (STT/LLM/TTS) to live
  phone calls. It offers real-time bidirectional audio over WebSocket (L16/8000 Hz, sub-250ms latency)
  and programmable SIP trunking, with webhook event delivery and official Python (teler) and Node
  (@frejun/teler) SDKs.
